<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hoijun Kim">
  <title>Hoijun Kim</title>
  <!-- A sheet of paper with an H built from three bars, the crossbar
       overshooting both stems. Kept as a light tile with a dark mark, the
       inverse of the shape logo (dark tile, coloured bars), so the two read as
       different hands. Geometry is mirrored in tools/make-icons.py. -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="#F4F1EA" stroke="#1A1917" stroke-width="4.5"/>
  <g fill="#1A1917">
    <rect x="14" y="13" width="8.5" height="38" rx="2.5"/>
    <rect x="41.5" y="13" width="8.5" height="38" rx="2.5"/>
    <rect x="11.5" y="27.75" width="41" height="8.5" rx="2.5"/>
  </g>
</svg>
