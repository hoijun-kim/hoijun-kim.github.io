name: deploy

# The site is built rather than served straight from the repo: Astro renders
# the pages, then tools/post-build.py cuts a Korean subset for every page that
# needs one and draws a card per post.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; let a newer push win
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - run: pip install "fonttools[woff]" pillow

      # ~5 MB of TrueType that never ships: the Korean faces the subsetter cuts
      # from, and the latin faces the card drawer sets type in
      - name: Cache the font sources
        uses: actions/cache@v4
        with:
          path: tools/.fonts
          key: fonts-${{ hashFiles('tools/make-fonts.py') }}

      - name: Fetch the font sources
        run: python tools/make-fonts.py --cache-only

      - run: npm run build

      # The Korean subsets are cut per weight from the markup; this asks a real
      # browser whether that split matches what the cascade resolves, so a
      # syllable never ships in the wrong thickness.
      - run: npm run check:fonts

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Only when the writing changed - the engines ask to be told about content,
  # not about every stylesheet tweak. Google ignores IndexNow entirely; this
  # reaches Bing, Yandex, Naver, Seznam and Yep, which share submissions.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 &&
             git diff --name-only HEAD~1 HEAD | grep -q '^src/content/'; then
            echo "posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "posts=false" >> "$GITHUB_OUTPUT"
          fi

      # reads the sitemap that was just deployed, so there is nothing to build
      - if: steps.changed.outputs.posts == 'true'
        run: python tools/indexnow.py
