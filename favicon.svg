  <g fill="#1A1917">
    <rect x="20.5" y="15" width="7" height="34"/>
    <rect x="36.5" y="15" width="7" height="34"/>
    <rect x="27.5" y="28" width="9" height="6"/>
    <rect x="16.5" y="15" width="15" height="3.75"/>
    <rect x="32.5" y="15" width="15" height="3.75"/>
    <rect x="16.5" y="45.25" width="15" height="3.75"/>
    <rect x="32.5" y="45.25" width="15" height="3.75"/>
  </g>
</svg>
