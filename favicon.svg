<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hoijun Kim">
  <title>Hoijun Kim</title>
  <!-- A sheet of paper with a serif H: the personal mark. Deliberately the
       inverse of the shape logo (dark tile, coloured bars) so the two read as
       different hands. Geometry is mirrored in tools/make-icons.py. -->
